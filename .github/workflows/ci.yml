name: CI

on:
  # Vets external pull requests too (audit N2): pull_request runs with a
  # read-only token on forked repos, and same-repo PRs simply get both a push
  # and a pull_request run.
  - push
  - pull_request

# No token permissions by default; jobs opt in to exactly what they need
# (audit N2).
permissions: {}

jobs:
  ci:
    runs-on: ubuntu-latest

    # The test job executes dependency code (install scripts, build, tests),
    # so it must not hold a write token (audit N2). All actions are pinned to
    # full commit SHAs, not mutable major tags (audit N1).
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js with pnpm
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: pnpm install -r --frozen-lockfile

      - name: Security audit (fails on new high or critical production advisories)
        run: pnpm audit-ci

      - name: Run linter
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      - name: Build tests
        run: pnpm build:tests

      - name: Run tests
        run: pnpm test

      - name: Coverage report
        run: pnpm coverage:report
        continue-on-error: true

      # Hand the badge artifacts to the write-scoped badge job; on push runs
      # only a few kilobytes are kept, for one day.
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: |
            .github/badges/coverage.svg
            COVERAGE.md
          if-no-files-found: ignore
          retention-days: 1

  badge:
    needs: ci
    # Publishes only from pushes to this repository, never from pull requests
    # (a fork PR must not reach a write token).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    # contents: write is needed to force-push the ci-badges branch (ADR 084);
    # it is scoped to this job only, which runs no dependency code (audit N2).
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download coverage artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-report
          path: .

      # Publish the regenerated badge + report to the dedicated ci-badges
      # branch (single orphan commit, force-pushed) so the README badge tracks
      # main without ever putting an automated commit on main (ADR 084).
      # Publishes only when (a) the branch does not exist yet (first-run seed,
      # from any branch, so the README badge is never a dead link) or (b) this
      # is a main run and the rendered badge actually changed. GITHUB_TOKEN
      # pushes cannot retrigger workflows, and the [skip ci] marker documents
      # that no CI is expected on that branch.
      - name: Publish coverage badge
        run: |
          if [ ! -f .github/badges/coverage.svg ] || [ ! -f COVERAGE.md ]; then
            echo "coverage artifacts missing (coverage report failed?); skipping badge publish"
            exit 0
          fi
          if git ls-remote --exit-code --heads origin ci-badges >/dev/null; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "ci-badges exists and this is not main; skipping badge publish"
              exit 0
            fi
            git fetch -q --depth 1 origin ci-badges
            if git show FETCH_HEAD:.github/badges/coverage.svg | cmp -s - .github/badges/coverage.svg; then
              echo "badge unchanged; skipping publish (COVERAGE.md refreshes with the next badge change)"
              exit 0
            fi
          else
            echo "ci-badges branch missing; seeding it from this run"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-badges
          git rm -r -q --cached .
          git add -f .github/badges/coverage.svg COVERAGE.md
          git commit -m "coverage badge + report for ${GITHUB_SHA} [skip ci]"
          git push -f origin ci-badges
